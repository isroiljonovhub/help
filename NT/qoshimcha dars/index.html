<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Christmas</title>
   
    <link rel="stylesheet" href="./css/normalize.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <!-- header -->
    <header>
      <!-- navbar -->
      <nav class="container navbar">
        <a href="./index.html">
          <img src="./img/svg/site-logo.svg" alt="" />
        </a>
        <ul class="nav__list">
          <li class="list__item">
            <a href="#" class="sitenav_link active">Home</a>
          </li>
          <li class="list__item">
            <a href="#" class="sitenav_link">Celebrate</a>
          </li>
          <li class="list__item">
            <a href="#" class="sitenav_link">Gifts</a>
          </li>
          <li class="list__item">
            <a href="#" class="sitenav_link">New</a>
          </li>
        </ul>
        <img src="./img/svg/bars.svg" alt="bar icon" class="bar" />
      </nav>

      <!-- section hero -->
      <section class="hero">
        <div class="container hero-container">
          <div>
            <img
              class="hero__img"
              src="./img/png/hero.jpg"
              alt="happy new year img"
            />
          </div>
          <div class="hero__desc">
            <h1 class="hero__title">Merry Christmas and Happy New Year!</h1>
            <p class="hero__text">
              Christmas and a new year is about to begin, all good wishes and
              successes.
            </p>
            <button class="btn hero__btn">Get Started</button>
          </div>
        </div>
      </section>
    </header>
    <!-- header end -->
    <!-- main start -->
    <main>
        <section class="start-giving">
            <div class="container">
                <h3 class="start-giving-title">
                   Start Giving This Christmas 
                </h3>
                <div class="giving_carts">
                    <div class="giving_cart">
                        <img src="./" alt="">

                    </div>

                </div>
            </div>
        </section>
    </main>
    <!-- main end -->
    <!-- footer start -->
    <footer></footer>
    <!-- footer end -->
  </body>
</html>
